name: Ethereum RPC batch probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Measure dRPC batch size and recent USDC supply events
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://eth.drpc.org'
          usdc='0xA0b86991c6218b36c1d19d4a2e9Eb0cE3606eB48'
          topic='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          zero='0x'+'0'*64
          def send(body):
              req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={'Content-Type':'application/json','User-Agent':'KAFKA2306/tokenized-assets'},method='POST')
              with urllib.request.urlopen(req,timeout=20) as r: return json.loads(r.read())
          final=send({'jsonrpc':'2.0','id':1,'method':'eth_getBlockByNumber','params':['finalized',False]})['result']
          n=int(final['number'],16)
          for size in [5,10,20,50,100]:
              body=[{'jsonrpc':'2.0','id':i+1,'method':'eth_getBlockByNumber','params':[hex(n-i),False]} for i in range(size)]
              try:
                  result=send(body)
                  ok=isinstance(result,list) and len(result)==size and all(not row.get('error') for row in result)
                  print('BATCH',size,'OK' if ok else 'BAD',len(result) if isinstance(result,list) else type(result).__name__)
              except Exception as exc:
                  print('BATCH',size,'FAIL',type(exc).__name__,str(exc))
          for window in [20,50,100]:
              mint=send({'jsonrpc':'2.0','id':1000+window,'method':'eth_getLogs','params':[{'address':usdc,'fromBlock':hex(n-window+1),'toBlock':hex(n),'topics':[topic,zero]}]})
              burn=send({'jsonrpc':'2.0','id':2000+window,'method':'eth_getLogs','params':[{'address':usdc,'fromBlock':hex(n-window+1),'toBlock':hex(n),'topics':[topic,None,zero]}]})
              print('WINDOW',window,'MINT',len(mint.get('result',[])),'BURN',len(burn.get('result',[])),'UNIQUE_BLOCKS',len({int(x['blockNumber'],16) for x in mint.get('result',[])+burn.get('result',[])}))
          PY
