name: Tokenized assets evidence

on:
  pull_request:
    paths:
      - tokenized_assets.py
      - data/registry.json
      - data/issuer-observations.json
      - .github/workflows/tokenized-assets.yml
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Existing tests
        run: python -m unittest discover -v
      - name: Probe Ethereum finalized and archive access
        env:
          ETH_RPC_URL: https://ethereum-rpc.publicnode.com
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ['ETH_RPC_URL']
          def rpc(method, params):
              raw = json.dumps({'jsonrpc':'2.0','id':method,'method':method,'params':params}).encode()
              req = urllib.request.Request(url, data=raw, headers={'Content-Type':'application/json','User-Agent':'KAFKA2306/tokenized-assets'}, method='POST')
              with urllib.request.urlopen(req, timeout=30) as r:
                  payload = json.loads(r.read())
              if payload.get('error'):
                  raise RuntimeError(payload['error'])
              return payload['result']
          finalized = rpc('eth_getBlockByNumber', ['finalized', False])
          number = int(finalized['number'], 16)
          print('FINALIZED', number, finalized['hash'], int(finalized['timestamp'],16))
          historical = rpc('eth_getBlockByNumber', [hex(number - 650000), False])
          print('ARCHIVE', int(historical['number'],16), historical['hash'], int(historical['timestamp'],16))
          usdc = '0xA0b86991c6218b36c1d19d4a2e9Eb0cE3606eB48'
          supply = rpc('eth_call', [{'to':usdc,'data':'0x18160ddd'}, hex(number - 650000)])
          print('USDC_HISTORICAL_TOTAL_SUPPLY_RAW', int(supply,16))
          topic = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          zero = '0x' + '0'*64
          logs = rpc('eth_getLogs', [{'address':usdc,'fromBlock':hex(number-5000),'toBlock':hex(number),'topics':[topic,zero]}])
          print('MINT_LOGS_LAST_5000_BLOCKS', len(logs))
          if logs:
              assert logs[0]['blockHash'] and logs[0]['transactionHash']
          PY
