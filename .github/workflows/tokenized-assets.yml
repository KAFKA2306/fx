name: Tokenized assets evidence

on:
  pull_request:
    paths:
      - tokenized_assets.py
      - tokenized_assets_incremental.py
      - test_*.py
      - data/registry.json
      - data/issuer-observations.json
      - data/tokenized-assets/**
      - api/v1/tokenized-assets/**
      - .github/workflows/tokenized-assets.yml
      - README.md
  push:
    branches: [main]
    paths:
      - tokenized_assets.py
      - tokenized_assets_incremental.py
      - test_*.py
      - data/registry.json
      - data/issuer-observations.json
      - data/tokenized-assets/**
      - api/v1/tokenized-assets/**
      - .github/workflows/tokenized-assets.yml
      - README.md
  schedule:
    - cron: '40 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tokenized-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile and unit test
        run: |
          python -m py_compile tokenized_assets.py tokenized_assets_incremental.py test_issuer_snapshots.py test_tokenized_assets.py
          python -m unittest discover -v

      - name: Materialize stored evidence for pull-request verification
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p build/data build/api/v1
          cp -a data/tokenized-assets build/data/tokenized-assets
          cp -a api/v1/tokenized-assets build/api/v1/tokenized-assets

      - name: Collect primary evidence incrementally
        if: github.event_name != 'pull_request'
        run: |
          set +e
          endpoints=(
            "https://ethereum-rpc.publicnode.com"
            "https://rpc.ankr.com/eth"
          )
          for rpc in "${endpoints[@]}"; do
            echo "Collecting current finalized state from ${rpc}."
            python tokenized_assets_incremental.py --rpc-url "$rpc"
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
          done
          exit "$status"

      - name: Audit provenance and coverage
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          if '${{ github.event_name }}' == 'pull_request':
              data_root = Path('build/data/tokenized-assets')
              api = Path('build/api/v1/tokenized-assets')
          else:
              data_root = Path('data/tokenized-assets')
              api = Path('api/v1/tokenized-assets')

          index = json.loads((api / 'index.json').read_text())
          registry = json.loads((api / 'registry.json').read_text())
          issuer = json.loads((api / 'issuer.json').read_text())['records']
          chain = json.loads((api / 'chain-weekly.json').read_text())['records']
          deployments = json.loads((api / 'deployments.json').read_text())['records']
          mint_burn = json.loads((api / 'mint-burn.json').read_text())
          filings = json.loads((api / 'filings.json').read_text())['records']
          reconciliation = json.loads((api / 'reconciliation.json').read_text())['records']
          manifest = json.loads((data_root / 'raw/latest-manifest.json').read_text())

          coverage = index['coverage']
          assert coverage['issuer_span_days'] >= 90, coverage
          assert coverage['chain_span_days'] >= 90, coverage
          assert coverage['issuer_observation_count'] >= 8, coverage
          assert coverage['chain_observation_count'] >= 14, coverage
          assert coverage['non_stablecoin_asset_count'] >= 2, coverage
          assert coverage['deployment_count'] >= 4, coverage
          assert coverage['filing_count'] >= 2, coverage
          assert coverage['mint_event_count'] > 0, coverage
          assert coverage['burn_event_count'] > 0, coverage
          assert coverage['mint_burn_event_count'] > 0, coverage

          assert all(row['reserve_fair_value_usd'] >= row['circulation_usdc'] for row in issuer)
          assert all(len(row['source_sha256']) == 64 for row in issuer)
          assert all(row['chain_id'] == 1 and row['block_hash'] for row in chain)
          assert all(row['contract_address'].lower() == '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48' for row in chain)
          assert all(row['chain_id'] == 1 and row['block_hash'] and row['contract_source_url'].startswith('https://') for row in deployments)
          assert {'usdc', 'buidl', 'ousg'} <= {row['asset_id'] for row in deployments}
          assert {'buidl', 'ousg'} <= {row['asset_id'] for row in filings}
          assert all(row['chain_id'] == 1 and row['block_hash'] for row in mint_burn['events'])
          assert all(row['event_type'] in {'mint', 'burn'} for row in mint_burn['events'])
          assert all(row['correction_applied'] is False for row in reconciliation)
          assert all('not_like_for_like' in row['comparison_scope'] for row in reconciliation)

          assets = {row['asset_id']: row for row in registry['assets']}
          assert len(assets['buidl']['token_deployments']) == 2
          assert len(assets['ousg']['token_deployments']) == 1

          for key, item in manifest['evidence'].items():
              raw = (data_root / item['path']).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == item['sha256'], key
          PY

      - name: Rebuild API from stored evidence
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DATA_ROOT=build/data/tokenized-assets
            API_ROOT=build/api/v1/tokenized-assets
          else
            DATA_ROOT=data/tokenized-assets
            API_ROOT=api/v1/tokenized-assets
          fi
          rm -rf build/rebuilt-tokenized-assets
          python tokenized_assets.py \
            --offline \
            --data-root "$DATA_ROOT" \
            --api-dir build/rebuilt-tokenized-assets
          diff -ru "$API_ROOT" build/rebuilt-tokenized-assets

      - name: Upload pull-request evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tokenized-assets-evidence
          path: build
          retention-days: 30

      - name: Commit changed evidence and views
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/tokenized-assets api/v1/tokenized-assets
          if git diff --cached --quiet; then
            echo 'No tokenized-assets evidence change.'
            exit 0
          fi
          git commit -m 'data: update tokenized assets evidence'
          git push
