name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q tokenized_assets.py test_tokenized_assets.py test_issuer_snapshots.py
      - name: Unit tests
        run: python -m unittest discover -v
